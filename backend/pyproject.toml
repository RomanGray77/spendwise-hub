[project]
name = "spendboard-backend"
version = "0.1.0"
description = "FastAPI and SQLAlchemy backend for SpendBoard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
